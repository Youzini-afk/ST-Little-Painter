<div id="st-little-painter-settings" class="stlp-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>ST-Little Painter</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <section class="stlp-section">
        <h4>Main</h4>
        <label class="checkbox_label" for="stlp-enabled">
          <input id="stlp-enabled" type="checkbox" />
          Enable ST-Little Painter
        </label>
        <label class="checkbox_label" for="stlp-auto-generate">
          <input id="stlp-auto-generate" type="checkbox" />
          Auto generate after supported chat events
        </label>
      </section>

      <section class="stlp-section">
        <h4>Tag API</h4>
        <label for="stlp-tag-api-url">Endpoint URL</label>
        <input id="stlp-tag-api-url" class="text_pole" type="url" placeholder="https://api.example.com/v1/chat/completions" />

        <label for="stlp-tag-api-key">API Key</label>
        <input id="stlp-tag-api-key" class="text_pole" type="password" autocomplete="off" placeholder="Stored in SillyTavern extension settings" />

        <label for="stlp-tag-api-model">Model</label>
        <input id="stlp-tag-api-model" class="text_pole" type="text" placeholder="tagger-model-name" />

        <label for="stlp-temperature">Temperature</label>
        <input id="stlp-temperature" class="text_pole" type="number" min="0" max="2" step="0.1" />

        <label for="stlp-max-tokens">Max Tokens</label>
        <input id="stlp-max-tokens" class="text_pole" type="number" min="128" step="128" />

        <label for="stlp-timeout-ms">Timeout (ms)</label>
        <input id="stlp-timeout-ms" class="text_pole" type="number" min="1000" step="1000" />

        <label for="stlp-retry-count">Retry Count</label>
        <input id="stlp-retry-count" class="text_pole" type="number" min="0" max="5" step="1" />
      </section>

      <section class="stlp-section">
        <h4>Backend</h4>
        <label class="checkbox_label" for="stlp-backend-enabled">
          <input id="stlp-backend-enabled" type="checkbox" />
          Generate Image After Tags
        </label>

        <label for="stlp-backend-type">Backend type</label>
        <select id="stlp-backend-type" class="text_pole">
          <option value="sdWebui">SD WebUI</option>
          <option value="novelai">NovelAI</option>
          <option value="comfyui">ComfyUI</option>
          <option value="naturalImage">Natural Image</option>
        </select>
      </section>

      <section class="stlp-section">
        <h4>SD WebUI</h4>
        <label for="stlp-sdwebui-url">WebUI URL</label>
        <input id="stlp-sdwebui-url" class="text_pole" type="url" placeholder="http://127.0.0.1:7860" />

        <label for="stlp-sdwebui-username">Username</label>
        <input id="stlp-sdwebui-username" class="text_pole" type="text" autocomplete="username" />

        <label for="stlp-sdwebui-password">Password</label>
        <input id="stlp-sdwebui-password" class="text_pole" type="password" autocomplete="current-password" />

        <label for="stlp-sdwebui-width">Width</label>
        <input id="stlp-sdwebui-width" class="text_pole" type="number" min="64" step="8" />

        <label for="stlp-sdwebui-height">Height</label>
        <input id="stlp-sdwebui-height" class="text_pole" type="number" min="64" step="8" />

        <label for="stlp-sdwebui-steps">Steps</label>
        <input id="stlp-sdwebui-steps" class="text_pole" type="number" min="1" step="1" />

        <label for="stlp-sdwebui-cfg-scale">CFG Scale</label>
        <input id="stlp-sdwebui-cfg-scale" class="text_pole" type="number" min="0" step="0.5" />

        <label for="stlp-sdwebui-sampler">Sampler</label>
        <input id="stlp-sdwebui-sampler" class="text_pole" type="text" placeholder="Euler a" />

        <label for="stlp-sdwebui-seed">Seed</label>
        <input id="stlp-sdwebui-seed" class="text_pole" type="number" step="1" />

        <label class="checkbox_label" for="stlp-sdwebui-restore-faces">
          <input id="stlp-sdwebui-restore-faces" type="checkbox" />
          Restore faces
        </label>

        <label class="checkbox_label" for="stlp-sdwebui-send-negative">
          <input id="stlp-sdwebui-send-negative" type="checkbox" />
          Send negative prompt
        </label>
      </section>

      <section class="stlp-section">
        <h4>NovelAI</h4>
        <label for="stlp-novelai-url">NovelAI URL</label>
        <input id="stlp-novelai-url" class="text_pole" type="url" placeholder="https://image.novelai.net" />
        <label for="stlp-novelai-api-key">API Key</label>
        <input id="stlp-novelai-api-key" class="text_pole" type="password" autocomplete="off" />
        <label for="stlp-novelai-model">Model</label>
        <input id="stlp-novelai-model" class="text_pole" type="text" placeholder="nai-diffusion-3" />
        <label for="stlp-novelai-sampler">Sampler</label>
        <input id="stlp-novelai-sampler" class="text_pole" type="text" placeholder="k_euler_ancestral" />
        <label for="stlp-novelai-scheduler">Scheduler</label>
        <input id="stlp-novelai-scheduler" class="text_pole" type="text" placeholder="native" />
        <div class="stlp-grid">
          <label>Width <input id="stlp-novelai-width" class="text_pole" type="number" min="64" step="8" /></label>
          <label>Height <input id="stlp-novelai-height" class="text_pole" type="number" min="64" step="8" /></label>
          <label>Steps <input id="stlp-novelai-steps" class="text_pole" type="number" min="1" step="1" /></label>
          <label>Scale <input id="stlp-novelai-scale" class="text_pole" type="number" min="0" step="0.1" /></label>
          <label>Seed <input id="stlp-novelai-seed" class="text_pole" type="number" step="1" /></label>
        </div>
        <label for="stlp-novelai-negative-prompt">Additional negative prompt</label>
        <textarea id="stlp-novelai-negative-prompt" class="text_pole" rows="2"></textarea>
      </section>

      <section class="stlp-section">
        <h4>ComfyUI</h4>
        <label for="stlp-comfyui-url">ComfyUI URL</label>
        <input id="stlp-comfyui-url" class="text_pole" type="url" placeholder="http://127.0.0.1:8188" />
        <label for="stlp-comfyui-workflow-json">API workflow JSON</label>
        <textarea id="stlp-comfyui-workflow-json" class="text_pole stlp-code-input" rows="8" placeholder="Use ComfyUI Save API Format. Placeholders: {{positive}}, {{negative}}, {{width}}, {{height}}, {{steps}}, {{cfg}}, {{seed}}, {{sampler}}, {{scheduler}}, {{model}}, {{vae}}, {{clip}}"></textarea>
        <div class="stlp-grid">
          <label>Width <input id="stlp-comfyui-width" class="text_pole" type="number" min="64" step="8" /></label>
          <label>Height <input id="stlp-comfyui-height" class="text_pole" type="number" min="64" step="8" /></label>
          <label>Steps <input id="stlp-comfyui-steps" class="text_pole" type="number" min="1" step="1" /></label>
          <label>CFG <input id="stlp-comfyui-cfg" class="text_pole" type="number" min="0" step="0.1" /></label>
          <label>Seed <input id="stlp-comfyui-seed" class="text_pole" type="number" step="1" /></label>
        </div>
        <label for="stlp-comfyui-sampler">Sampler</label>
        <input id="stlp-comfyui-sampler" class="text_pole" type="text" />
        <label for="stlp-comfyui-scheduler">Scheduler</label>
        <input id="stlp-comfyui-scheduler" class="text_pole" type="text" />
        <label for="stlp-comfyui-model">Model</label>
        <input id="stlp-comfyui-model" class="text_pole" type="text" />
        <div class="stlp-grid">
          <label>Poll interval ms <input id="stlp-comfyui-poll-interval-ms" class="text_pole" type="number" min="0" step="100" /></label>
          <label>Max polls <input id="stlp-comfyui-max-polls" class="text_pole" type="number" min="1" step="1" /></label>
        </div>
      </section>

      <section class="stlp-section">
        <h4>Natural Image</h4>
        <label for="stlp-natural-image-provider-mode">Provider mode</label>
        <select id="stlp-natural-image-provider-mode" class="text_pole">
          <option value="openaiImages">OpenAI-compatible Images</option>
          <option value="grokImages">Grok-compatible Images</option>
          <option value="chatMarkdownImage">Chat returns image URL/Markdown</option>
          <option value="openaiChatImage">Legacy chat image alias</option>
        </select>
        <label for="stlp-natural-image-url">API Base URL</label>
        <input id="stlp-natural-image-url" class="text_pole" type="url" placeholder="https://api.example.com/v1" />
        <label for="stlp-natural-image-api-key">API Key</label>
        <input id="stlp-natural-image-api-key" class="text_pole" type="password" autocomplete="off" />
        <label for="stlp-natural-image-model">Image model</label>
        <input id="stlp-natural-image-model" class="text_pole" type="text" placeholder="gpt-image-1 / grok-2-image" />
        <label for="stlp-natural-image-chat-model">Chat image model</label>
        <input id="stlp-natural-image-chat-model" class="text_pole" type="text" />
        <div class="stlp-grid">
          <label>Size <input id="stlp-natural-image-size" class="text_pole" type="text" placeholder="1024x1024" /></label>
          <label>Width <input id="stlp-natural-image-width" class="text_pole" type="number" min="64" step="8" /></label>
          <label>Height <input id="stlp-natural-image-height" class="text_pole" type="number" min="64" step="8" /></label>
        </div>
        <label for="stlp-natural-image-quality">Quality</label>
        <input id="stlp-natural-image-quality" class="text_pole" type="text" placeholder="standard / hd / auto" />
        <label for="stlp-natural-image-response-format">Response format</label>
        <input id="stlp-natural-image-response-format" class="text_pole" type="text" placeholder="b64_json or url; leave empty if provider rejects it" />
        <label for="stlp-natural-image-instruction-prefix">Instruction prefix</label>
        <textarea id="stlp-natural-image-instruction-prefix" class="text_pole" rows="2"></textarea>
        <label for="stlp-natural-image-instruction-suffix">Instruction suffix</label>
        <textarea id="stlp-natural-image-instruction-suffix" class="text_pole" rows="2"></textarea>
      </section>

      <section class="stlp-section">
        <h4>Image Preview</h4>
        <div id="stlp-image-preview-list" class="stlp-image-preview-list"></div>
      </section>

      <section class="stlp-section">
        <h4>Mode</h4>
        <label for="stlp-mode">Runtime mode</label>
        <select id="stlp-mode" class="text_pole">
          <option value="fast">Fast</option>
          <option value="smart">Smart</option>
          <option value="expert">Expert</option>
        </select>

        <label for="stlp-history-count">Recent message count</label>
        <input id="stlp-history-count" class="text_pole" type="number" min="1" max="100" step="1" />

        <div class="stlp-actions">
          <button id="stlp-manual-generate" class="menu_button" type="button">Manual Generate</button>
        </div>
      </section>

      <section class="stlp-section">
        <h4>Debug</h4>
        <label class="checkbox_label" for="stlp-debug-enabled">
          <input id="stlp-debug-enabled" type="checkbox" />
          Enable debug trace capture
        </label>

        <div class="stlp-actions">
          <button id="stlp-export-trace" class="menu_button" type="button">Export Trace</button>
        </div>

        <label for="stlp-trace-output">Latest trace</label>
        <textarea id="stlp-trace-output" class="text_pole stlp-trace-output" readonly></textarea>
      </section>
    </div>
  </div>
</div>
